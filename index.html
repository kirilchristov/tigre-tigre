<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Geist Mono Font (non-render-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />

    <!-- Preload critical images -->
    <link
      rel="preload"
      as="image"
      href="/images/mocks/mock-lg.webp"
      type="image/webp"
      imagesrcset="/images/mocks/mock-sm.webp 640w, /images/mocks/mock-md.webp 1024w, /images/mocks/mock-lg.webp 1496w"
      imagesizes="(max-width: 768px) 100vw, 1496px"
    />

    <!-- Primary Meta Tags -->
    <title>tigre tigre - Chili Crunch</title>
    <meta name="title" content="tigre tigre - Extra Crispy Chili Crunch" />
    <meta
      name="description"
      content="Experience the bold, authentic flavors of tigre tigre chili crunch. Crafted with premium ingredients, perfect for elevating any dish with rich, spicy goodness."
    />
    <meta
      name="keywords"
      content="chili crunch, hot sauce, spicy condiment, premium chili oil, handcrafted sauce, tigre tigre, люто, хрупкаво чили, подправка, лют сос, чили крънч"
    />
    <meta name="author" content="tigre tigre" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tigre-tigre.com/" />
    <meta property="og:title" content="tigre tigre - Chili Crunch" />
    <meta
      property="og:description"
      content="Experience the bold, authentic flavors of tigre tigre chili crunch. Crafted with premium ingredients."
    />
    <meta property="og:image" content="https://tigre-tigre.com/images/mocks/mock-sm.webp" />
    <meta property="og:site_name" content="tigre tigre" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://tigre-tigre.com/" />
    <meta property="twitter:title" content="tigre tigre - Premium Chili Crunch" />
    <meta
      property="twitter:description"
      content="Experience the bold, authentic flavors of tigre tigre chili crunch. Crafted with premium ingredients."
    />
    <meta property="twitter:image" content="https://tigre-tigre.com/images/mocks/mock-sm.webp" />

    <!-- Additional Meta Tags -->
    <meta name="theme-color" content="#000000" />
    <link rel="canonical" href="https://tigre-tigre.com/" />
  </head>
  <body>
    <script>
      if (localStorage.theme === 'dark') document.documentElement.classList.add('dark')
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
