<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-light.svg" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon-light.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon-dark.svg"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Geist Mono Font (non-render-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />

    <!-- Preload critical images -->
    <link
      rel="preload"
      as="image"
      href="/images/product-shots/2026_front-2048x2048.webp"
      type="image/webp"
      imagesrcset="/images/product-shots/2026_front-1280x1280.webp 1280w, /images/product-shots/2026_front-2048x2048.webp 2048w"
      imagesizes="(max-width: 768px) 100vw, 2048px"
    />

    <!-- Route metadata is injected by the prerenderer and synchronized client-side. -->
    <title>tigre tigre</title>
    <meta name="author" content="tigre tigre" />
    <meta property="og:site_name" content="tigre tigre" />

    <!-- Additional Meta Tags -->
    <meta name="theme-color" content="#000000" />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "tigre tigre",
      "url": "https://tigre-tigre.com",
      "logo": "https://tigre-tigre.com/tigre-tigre-logo.svg"
    }
    </script>
  </head>
  <body>
    <noscript>
      <img
        height="1"
        width="1"
        style="display: none"
        src="https://www.facebook.com/tr?id=2187360742019843&ev=PageView&noscript=1"
        alt=""
      />
    </noscript>
    <script>
      if (localStorage.theme === 'dark') document.documentElement.classList.add('dark')
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
